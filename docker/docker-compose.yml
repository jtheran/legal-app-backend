services:
  # 1. Base de datos relacional (Gestión de casos, usuarios, clientes)
  postgres:
    image: postgres:15-alpine
    container_name: legal-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: legal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Cache y gestión de sesiones (Velocidad para el chatbot y auth)
  redis:
    image: redis:7-alpine
    container_name: legal-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass zaqwer --appendonly yes
    volumes:
      - redis_data:/data

  # 3. Base de datos vectorial (Memoria del chatbot / RAG)
  qdrant:
    image: qdrant/qdrant:v1.17.0 
    container_name: legal-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. Almacenamiento de archivos compatible con S3 (Documentos legales)
  minio:
    image: quay.io/minio/minio:latest
    container_name: legal-minio
    restart: always
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Consola Web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data: