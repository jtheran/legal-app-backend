/auth/login:
  post:
    tags: [Auth]
    summary: Iniciar sesión
    description: >
      Autentica al usuario con email y contraseña.
      Retorna un token JWT y registra la sesión en Redis.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      200:
        description: Login exitoso
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
      401:
        description: Credenciales inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              message: "Credenciales inválidas"
      500:
        $ref: '#/components/responses/InternalError'

/auth/register:
  post:
    tags: [Auth]
    summary: Registrar nuevo abogado
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      201:
        description: Abogado registrado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Abogado registrado correctamente"
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/auth/profile:
  get:
    tags: [Auth]
    summary: Obtener perfil del usuario autenticado
    security:
      - bearerAuth: []
    responses:
      200:
        description: Perfil del usuario
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'

/auth/refresh-token:
  post:
    tags: [Auth]
    summary: Refrescar Access Token vía Redis
    description: >
      Verifica el Refresh Token enviado (vía cookie o body) contra la sesión activa en Redis.
      Si es válido, genera un nuevo par de tokens y actualiza Redis.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'
    responses:
      200:
        description: Tokens actualizados
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenResponse'
      403:
        description: Sesión expirada o token revocado

/auth/logout:
  post:
    tags: [Auth]
    summary: Cerrar sesión
    description: >
      Elimina las llaves de acceso y refresco del usuario en Redis, 
      invalidando cualquier token existente inmediatamente.
    security:
      - bearerAuth: []
    responses:
      200:
        description: Sesión eliminada de Redis y cookies limpias