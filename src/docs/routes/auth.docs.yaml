/auth/login:
  post:
    tags: [Auth]
    summary: Iniciar sesión
    description: >
      Autentica al usuario con email y contraseña.
      Retorna un token JWT y registra la sesión en Redis.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      200:
        description: Login exitoso
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
      401:
        description: Credenciales inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              message: "Credenciales inválidas"
      500:
        $ref: '#/components/responses/InternalError'

/auth/register:
  post:
    tags: [Auth]
    summary: Registrar nuevo abogado
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      201:
        description: Abogado registrado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Abogado registrado correctamente"
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'

/auth/profile:
  get:
    tags: [Auth]
    summary: Obtener perfil del usuario autenticado
    security:
      - bearerAuth: []
    responses:
      200:
        description: Perfil del usuario
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'

/auth/logout:
  get:
    tags: [Auth]
    summary: Cerrar sesión
    description: Invalida la sesión eliminando el registro en Redis.
    security:
      - bearerAuth: []
    responses:
      200:
        description: Sesión cerrada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Sesión cerrada exitosamente"
      401:
        $ref: '#/components/responses/Unauthorized'