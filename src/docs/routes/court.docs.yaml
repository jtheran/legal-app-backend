/courts:
  get:
    tags: [Courts]
    summary: Listar despachos y juzgados judiciales
    description: Retorna los juzgados del sistema. Por defecto, solo trae los activos (`isActive true`).
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: type
        in: query
        description: Filtrar por tipo de juzgado (CIVIL, PENAL, LABORAL, etc.)
        schema:
          type: string
      - name: city
        in: query
        description: Filtrar por ciudad (Ej. Cartagena)
        schema:
          type: string
      - name: includeInactive
        in: query
        description: Si es true y eres ADMIN, incluye juzgados deshabilitados.
        schema:
          type: boolean
          default: false
    responses:
      200:
        description: Operación exitosa
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourtListResponse'
      401:
        $ref: '#/components/responses/Unauthorized'

  post:
    tags: [Courts]
    summary: Crear un nuevo despacho judicial
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CourtCreateInput'
    responses:
      201:
        description: Juzgado registrado correctamente
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        description: Prohibido - Se requiere rol de ADMIN

/courts/{id}:
  get:
    tags: [Courts]
    summary: Obtener el detalle de un juzgado
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - bearerAuth: []
    responses:
      200:
        description: Datos del juzgado recuperados
      404:
        description: Despacho no encontrado

  put:
    tags: [Courts]
    summary: Actualizar datos de un despacho judicial
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CourtCreateInput'
    responses:
      200:
        description: Cambios aplicados con éxito
      403:
        description: Requiere privilegios de ADMIN

/courts/{id}/deactivate:
  patch:
    tags: [Courts]
    summary: Desactivar un despacho judicial de la plataforma
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - bearerAuth: []
    responses:
      200:
        description: Juzgado desactivado correctamente
      403:
        description: Acceso denegado